# Generated by scripts/corpus_editions.py in the site repository. Do not edit here.
#
# Publishes every download as a GitHub Release on each push to main, so the README's
# links (releases/latest/download/<file>) always fetch the newest build, and every
# update leaves a dated release to compare or roll back to.
name: release-downloads

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-downloads
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Everything zip
        run: zip -qr invisible-ships-corpus.zip . -x '.git/*' '.github/*'

      - name: Build the nine-file pack for AI
        run: zip -qjX invisible-ships-for-ai.zip bundles/IS_BUNDLE_*.md

      - name: Publish the release with every download attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="corpus-$(date -u +%Y-%m-%d-%H%M%S)"
          gh release create "$TAG" \
            --title "Corpus, $(date -u '+%d %B %Y')" \
            --notes "The Invisible Ships corpus as of this commit. Downloads: the brief, the study edition, the 9 bundles, and Everything (the whole archive, zipped). How to use them: see the README." \
            --latest \
            editions/*.md bundles/*.md invisible-ships-corpus.zip invisible-ships-for-ai.zip
